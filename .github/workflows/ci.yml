name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push makes the runs for the previous one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - run: pnpm lint

      - run: pnpm typecheck

      - name: Unit tests, import accuracy, coverage
        run: pnpm test:coverage

      - name: Every template's PDF, DOCX, and TXT read back in order
        run: pnpm validate:exports

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - run: pnpm build

      - name: The offline worker precaches the app
        run: test -s dist/sw.js && grep -q '"/platform/"' dist/sw.js
